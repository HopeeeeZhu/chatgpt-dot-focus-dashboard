合成数据"],"source":"合成演示数据，无真实聊天来源","sourceState":"仅用于界面演示，非真实执行状态。","note":"暂无下一步；如需体验可撤销演示标记。"}];

const taskUrl=id=>null;
const clone=x=>JSON.parse(JSON.stringify(x));
const defaults=()=>({version:2,overrides:{},priorities:{},plans:{},nav:{layer:'home',status:'all',category:null,project:'all',owner:'all'},expanded:[],current:null,space:{open:false,taskId:null,notes:{},scratch:{},draft:{}},timer:{taskId:null,duration:1500,remaining:1500,endAt:null,running:false,finished:false},events:[],simCount:0,lastEdit:null,migration:null});

const statusLabels={all:'全部事项',open:'未完成',confirm:'待你确认',todo:'待处理',waiting:'等待 / 暂缓',done:'已完成'},priorityLabels={high:'高',medium:'中',low:'低'},categoryLabels={focus:'专注处理',quick:'随手解决'};

function tasks(){return seed.map(t=>({...t,...state.overrides[t.id],priority:state.priorities[t.id]||t.plan.priority,priorityCustom:!!state.priorities[t.id],plan:{...clone(t.plan),...state.plans[t.id]}}));}
function byId(id){return tasks().find(t=>t.id===id);}
function save(touch=true){if(touch)state.lastEdit=Date.now();if(persistBlocked){storageOK=false;renderStorage();return;}try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;}renderStorage();}
function renderStorage(){const msg=persistBlocked?loadNotice:!storageOK?'本地保存不可用，本次改动可能无法在刷新后保留。':loadNotice;$('storageNotice').hidden=!msg;$('storageNotice').textContent=msg;$('saveStatus').textContent=storageOK?`变更仅保存在本浏览器，不影响真实聊天或任务。${state.lastEdit?' 本地操作 '+localTime(state.lastEdit):''}`:'本地保存不可用，本次操作仅临时保留。';}
function stats(list=tasks()){const done=list.filter(t=>t.status==='done').length;return{total:list.length,done,open:list.length-done,confirm:list.filter(t=>t.status==='confirm').length};}
function statusMatch(t,status=state.nav.status){return status==='all'||(status==='open'?t.status!=='done':t.status===status);}
function filtered(includeCategory=true){return tasks().filter(t=>statusMatch(t)&&(!includeCategory||!state.nav.category||t.category===state.nav.category)&&(state.nav.project==='all'||t.project===state.nav.project)&&(state.nav.owner==='all'||t.owner===state.nav.owner));}
function crumb(last){return `<nav class="breadcrumb" aria-label="面包屑"><button data-home>首页</button>${icon('chevron')}<button data-categories>${esc(statusLabels[state.nav.status])} · 选类型</button>${last?icon('chevron')+`<span aria-current="page">${esc(last)}</span>`:''}</nav>`;}
function renderHome(){const c=stats();return `<section class="hero"><div class="eyebrow">01 / Choose here, continue there</div><h1>先选一件，再回到你的工作。</h1><p>此分享副本使用合成任务，未配置真实执行对话。可体验选择与复制说明，再回到你自己的原对话。</p></section><section class="home-counts" aria-label="全部演示事项统计"><button class="metric" data-status="all"><span>总事项数</span><strong>${c.total}</strong><small>本 Demo 选取的全部事项</small>${icon('arrow')}</button><button class="metric" data-status="done"><span>已完成</span><strong>${c.done}</strong><small>快照记录 / 本地演示标记</small>${icon('arrow')}</button><button class="metric" data-status="open"><span>未完成</span><strong>${c.open}</strong><small>包括等待 / 暂缓</small>${icon('arrow')}</button><button class="metric" data-status="confirm"><span>待你确认</span><strong>${c.confirm}</strong><small>未完成事项的子集</small>${icon('arrow')}</button></section><section class="home-next"><div><h2>先选处理方式，再挑一件。</h2><p>这里演示任务选择；实际讨论和推进留在你自己的工作场景，无需回来补写进度。</p></div><button class="btn btn-primary" data-status="open">查看未完成事项 ${icon('arrow')}</button></section><p class="home-note">已完成 ${c.done} + 未完成 ${c.open} = 总数 ${c.total}。待你确认 ${c.confirm} 项包含在未完成中。计数包含本地演示标记，不代表原对话已更新。<br>优先级是可调整的本地偏好，没有为你排期，也没有虚构截止时间。</p><details class="usage-guide"><summary>使用方法：先拆下一步，再到真实对话减少干扰</summary><div class="usage-body"><h2>三个维度，分别判断</h2><p><strong>紧急性：</strong>立即 / 可排期，依据真实时限或外部阻塞。<strong>处理方式：</strong>专注 / 随手，依据注意力与耗时。<strong>重要性：</strong>高 / 中 / 低，依据影响与阻塞。高重要性不自动等于立即，耗时短也不自动排第一。</p><p class="small-note">本页尚无独立紧急性字段或筛选。这里是使用建议，不会自动为任务排期。</p><h2>长期事项，先拆成一个可完成的小步</h2><p>写清动词、对象、结束条件与预计投入。例如：读一份示例材料，写下 1 个待确认问题，预计 25–40 分钟。完成这一步不等于完成整个长期目标。</p><h2>真正的专注发生在原对话</h2><ol><li>复制说明，自行回到你要继续的真实任务对话。此分享副本没有真实任务链接。</li><li>确认 Codex 窗口已获得焦点；若项目侧栏仍可见，macOS 默认按 ⌘B 收起。若已隐藏，无需再按。</li><li>继续在同一真实对话输入和执行；需要时可用 macOS 默认 ⌃⌘F 全屏。</li></ol><p class="small-note">⌘B 是切换键，快捷键可能被修改，可用 ⌘/ 查看当前绑定。不要在 HTML 浏览器窗口里操作后认为 Codex 已隔离。本页不会自动控制应用、暂停通知或回读进度；实际设备效果仍需验证。</p></div></details>`;}
function renderCategories(){const list=filtered(false),count=stats(list);return `${crumb()}<div class="page-heading"><div><div class="eyebrow">02 / Choose your mode</div><h1>这一刻，适合哪种节奏？</h1><p>当前查看「${esc(statusLabels[state.nav.status])}」。等待 / 暂缓属于任务状态，仍归在这两类中。</p></div><span class="view-count">当前筛选：${list.length} 项</span></div><div class="category-grid">${['focus','quick'].map(cat=>{const n=list.filter(t=>t.category===cat).length;return `<button class="category-card" data-category="${cat}"><span class="symbol">${icon(cat==='focus'?'focus':'bolt')}</span><span class="count">${n}<small>当前筛选下</small></span><h2>${categoryLabels[cat]}</h2><p>${cat==='focus'?'留出一段完整注意力，推进需要思考的事。':'有一点空档，做一个决定或小范围验证。'}<br>${cat==='focus'?'预计 25–60 分钟':'预计 2–10 分钟'} · 你的投入，估算非承诺</p><span class="category-bottom">进入后按重要性查看 ${icon('arrow')}</span></button>`;}).join('')}</div><p class="suggestion-note">两类计数合计 ${list.length} 项，范围为当前状态筛选。总事项数始终可回首页查看。</p>`;}

function continuationControls(t){const url=taskUrl(t.id);return `<button class="btn btn-primary" data-confirm-route="${t.id}">回原对话确认 ${icon('arrow')}</button><button class="btn btn-secondary" data-copy-task="${t.id}">复制操作说明</button>`;}
function routingNote(t){return taskUrl(t.id)?'桌面 Codex 可打开；手机 / 浏览器可能无法唤起。点击仅请求系统打开原对话，不提交消息或改变任务状态。':'分享示例未配置真实执行对话。你可以复制操作说明，手动回到自己的原对话。';}
function taskCard(t){const expanded=state.expanded.includes(t.id);return `<article class="task-card ${t.status==='done'?'done':''} ${expanded?'is-expanded':''}" data-task-id="${t.id}" id="task-${t.id}"><button class="task-summary" data-expand="${t.id}" aria-expanded="${expanded}" aria-controls="preview-${t.id}"><span class="task-main"><span class="task-title-line"><span class="task-title">${esc(t.title)}</span><span class="task-status ${t.status}">${esc(statusLabels[t.status])}</span></span><span class="task-metadata"><span>分配日期：${t.plan.assigned||'未记录'}</span><span>${esc(stepLabel(t))}</span><span>${t.time?'预计 '+esc(t.time)+' 分钟':'耗时未记录'}</span><span><b>${t.priorityCustom?'本地偏好':'建议'}优先级：${priorityLabels[t.priority]}</b></span></span></span><svg class="chevron" aria-hidden="true"><use href="#i-chevron"/></svg></button><div class="task-preview" id="preview-${t.id}"><div class="preview-inner"><p class="task-brief">${esc(t.summary)} 下一步：${esc(t.next)}</p><p class="task-plan-note">步骤是可编辑的建议拆分，不代表已核实的执行进度。 ${t.time?'你的预计投入 '+esc(t.time)+' 分钟，估算不是承诺。':''}</p><div class="task-controls">${continuationControls(t)}<button class="btn btn-quiet" data-details="${t.id}">任务卡</button><label class="priority-control">本地优先级<select data-priority="${t.id}" aria-label="调整${esc(t.title)}的本地优先级">${['high','medium','low'].map(p=>`<option value="${p}" ${t.priority===p?'selected':''}>${priorityLabels[p]}${t.plan.priority===p?' · 默认建议':''}</option>`).join('')}</select></label>${t.priorityCustom?`<button class="tiny-button" data-restore-priority="${t.id}">恢复建议</button>`:''}</div><p class="task-basis">${routingNote(t)}</p></div></div></article>`;}
function renderList(){const list=filtered();return `${crumb(categoryLabels[state.nav.category])}<div class="page-heading"><div><div class="eyebrow">03 / One useful next step</div><h1>${categoryLabels[state.nav.category]}</h1><p>按重要性看。悬停或键盘聚焦展开；手机点任务行。挑一件，直接回原对话。</p></div><span class="view-count">当前筛选：${list.length} 项</span></div><div class="compact-filters"><label class="filter">状态<select id="statusFilter">${Object.entries(statusLabels).map(([k,v])=>`<option value="${k}" ${state.nav.status===k?'selected':''}>${v}</option>`).join('')}</select></label><label class="filter">项目<select id="projectFilter">${Object.entries({all:'全部项目',content:'内容准备',tools:'工具试用',archive:'资料整理',demo:'演示反馈'}).map(([k,v])=>`<option value="${k}" ${state.nav.project===k?'selected':''}>${v}</option>`).join('')}</select></label><label class="filter">责任人<select id="ownerFilter">${Object.entries({all:'全部责任人',you:'你',collaborator:'协作者（示例）'}).map(([k,v])=>`<option value="${k}" ${state.nav.owner===k?'selected':''}>${v}</option>`).join('')}</select></label><span class="filter-help">高 / 中 / 低是建议重要性，不是紧急程度</span></div>${list.length?['high','medium','low'].map(p=>{const group=list.filter(t=>t.priority===p);return group.length?`<section class="priority-group" data-priority-group="${p}"><div class="group-heading"><span class="priority-dot ${p}"></span><h2>${priorityLabels[p]}重要性</h2><span class="count">${group.length} 项</span></div>${group.map(taskCard).join('')}</section>`:'';}).join(''):`<div class="empty-state"><h2>这一层暂时是空的。</h2><p>当前类型与筛选条件下没有匹配事项。</p><button class="btn btn-secondary" id="clearFilters">清除状态与条件筛选</button></div>`}<p class="suggestion-note">耗时均是你的预计投入，不包含协作者的后续执行时间。手调优先级是本地偏好；建议步骤和演示完成标记也只保存在这里，不会回写真实聊天。</p><div class="utility-line"><button class="text-button" data-categories>← 返回两类任务</button><span>没有自动同步，也不要求回来更新进度</span></div>`;}
function render(){$('shell').hidden=false;$('app').innerHTML=state.nav.layer==='home'?renderHome():state.nav.layer==='categories'?renderCategories():renderList();renderStorage();}
function navigate(layer,options={}){state.nav={...state.nav,...options,layer};save();render();window.scrollTo(0,0);}
function goStatus(status){navigate('categories',{status,category:null,project:'all',owner:'all'});}
function chooseCategory(category){navigate('list',{category});}
function toggleExpand(id){state.expanded=state.expanded.includes(id)?state.expanded.filter(x=>x!==id):[...state.expanded,id];const el=$('task-'+id);el?.classList.toggle('is-expanded',state.expanded.includes(id));el?.querySelector('.task-summary')?.setAttribute('aria-expanded',String(state.expanded.includes(id)));save();}
function revealCard(el,on){if(!el)return;el.classList.toggle('is-revealed',on);el.querySelector('.task-summary')?.setAttribute('aria-expanded',String(on||state.expanded.includes(el.dataset.taskId)));}
function changePriority(id,value){if(!byId(id)||!priorityLabels[value])return;state.priorities[id]=value;if(!state.expanded.includes(id))state.expanded.push(id);save();render();toast('已保存本地优先级偏好，不改变原对话。');}
function restorePriority(id){delete state.priorities[id];save();render();toast('已恢复基于阻塞与影响的默认建议。');}
function toast(message,undo=null){clearTimeout(toastTimeout);undoAction=undo;$('toastText').textContent=message;$('toastUndo').hidden=!undo;$('toast').hidden=false;toastTimeout=setTimeout(()=>$('toast').hidden=true,undo?7000:4500);}
function completeTask(id){const t=byId(id);if(!t||t.status==='done')return;state.overrides[id]={...state.overrides[id],status:'done',previousStatus:t.status};save();closeModal();render();toast('已添加演示完成标记，原对话状态未更新。',()=>undoTask(id));}
function undoTask(id){const t=byId(id);if(!t||t.status!=='done')return;const prior=state.overrides[id]?.previousStatus||'todo';state.overrides[id]={status:prior};save();closeModal();render();toast('已撤销本地演示完成标记。');}
function showModal(html){lastFocused=document.activeElement;$('modal').innerHTML=html;$('modalBackdrop').hidden=false;document.body.classList.add('modal-open');$('modal').focus();}
function closeModal(){if($('modalBackdrop').hidden)return;$('modalBackdrop').hidden=true;document.body.classList.remove('modal-open');if(lastFocused?.isConnected)lastFocused.focus();}
function modalTop(text){return `<div class="modal-top"><span>${esc(text)}</span><button class="modal-close" data-close aria-label="关闭">${icon('close')}</button></div>`;}
function routeText(id){const t=byId(id);if(!t)return '';const url=taskUrl(id);return `任务：${t.title}\n${stepLabel(t)}\n下一步：${t.next}\n${t.time?'预计投入：'+t.time+' 分钟（估算）\n':''}${url?'原对话：'+url:'分享示例没有配置真实执行对话，请回到你自己的原对话。'}\n快照：${SNAPSHOT}，未接入实时更新。`;}
function showCopyFallback(id){showModal(`${modalTop('未自动复制 · 可以手动选中文本')}<h2 id="modalTitle">${taskUrl(id)?'复制任务与对话链接':'复制操作说明'}</h2><div class="modal-body"><p>浏览器未能写入剪贴板。可选择下方文本复制，再切回 Codex。</p><div class="field"><label for="copyText">可选中文本</label><textarea id="copyText" readonly rows="7">${esc(routeText(id))}</textarea></div></div><div class="modal-actions"><button class="btn btn-primary" id="selectCopyText">全选文本</button><button class="btn btn-secondary" data-close>关闭</button></div>`);const field=$('copyText');field?.focus();field?.select();}
async function copyTask(id){const text=routeText(id);if(!text)return;try{if(typeof navigator==='undefined'||!navigator.clipboard?.writeText)throw new Error('Clipboard unavailable');await navigator.clipboard.writeText(text);toast(taskUrl(id)?'已复制任务名、链接与下一步；没有提交到 Codex。':'操作说明已复制，请回到原对话确认。');}catch(e){showCopyFallback(id);}}
function confirmRoute(id){const t=byId(id);if(!t)return;showModal(`${modalTop('分享示例未配置真实对话')}<h2 id="modalTitle">回原对话确认</h2><div class="modal-body"><p>${esc(t.title)}</p><p style="margin-top:10px">下一步：${esc(t.next)}</p><p class="small-note">请把操作说明复制到你自己的原对话。此副本没有真实任务链接，也不会自动发送消息。</p></div><div class="modal-actions"><button class="btn btn-primary" data-copy-task="${t.id}">复制操作说明</button><button class="btn btn-secondary" data-close>关闭</button></div>`);}
function detailTask(id){const t=byId(id);if(!t)return;showModal(`${modalTop(t.projectName+' · 静态任务卡')}<h2 id="modalTitle">${esc(t.title)}</h2><div class="modal-body"><p>${esc(stepLabel(t))} · ${t.time?'预计 '+esc(t.time)+' 分钟，估算非承诺':'耗时未记录'}<br>分配日期：${t.plan.assigned||'未记录'}</p><div class="detail-section"><h3>下一问 / 下一动作</h3><p>${esc(t.next)}</p><p class="small-note">${esc(t.nextNote)}</p></div><div class="detail-section"><h3>继续处理</h3><div class="modal-actions" style="margin-top:0">${continuationControls(t)}</div><p class="small-note">${routingNote(t)}</p></div><p class="small-note">来源：${esc(t.source)} · 快照 ${SNAPSHOT}<br>默认优先级依据：${esc(t.plan.reason)}${t.priorityCustom?' 当前排序已采用你的本地偏好。':''}</p></div><div class="modal-actions">${!t.plan.real?`<button class="tiny-button" data-edit-steps="${t.id}">编辑本地建议步骤</button>`:''}<button class="tiny-button" ${t.status==='done'?'data-undo':'data-complete'}="${t.id}">${t.status==='done'?'撤销演示完成':'仅在 Demo 标记完成'}</button><button class="btn btn-quiet" data-close>关闭</button></div><p class="small-note">演示标记仅影响本页计数，不会确认真实任务完成。不需要回到面板补写进展。</p>`);}
function editSteps(id){const t=byId(id);if(!t||t.plan.real)return;showModal(`${modalTop('本地建议流程 · 不改真实任务')}<h2 id="modalTitle">编辑建议步骤</h2><div class="modal-body"><p>${esc(t.title)}</p><p class="small-note">每行一个步骤，最多 20 步。这里是你可调整的工作拆分，不是系统已核实的执行进度。</p><div class="field"><label for="stepsInput">建议流程（每行一步）</label><textarea id="stepsInput" maxlength="2000">${esc(t.plan.steps.join('\n'))}</textarea></div><div class="field"><label for="currentStepInput">当前建议从第几步开始</label><input id="currentStepInput" type="number" min="1" max="20" value="${t.plan.current}"></div><p id="stepError" class="error" hidden></p></div><div class="modal-actions"><button class="btn btn-primary" data-save-steps="${id}">保存本地步骤</button><button class="btn btn-secondary" data-reset-steps="${id}">恢复建议流程</button><button class="btn btn-quiet" data-close>取消</button></div>`);}
function saveSteps(id,lines,current){const t=byId(id);if(!t||t.plan.real)return false;const steps=lines.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const n=Number(current);if(!steps.length||steps.length>20||!Number.isInteger(n)||n<1||n>steps.length){if($('stepError')){$('stepError').hidden=false;$('stepError').textContent='请保留 1–20 个步骤，并把当前步骤设为 1 至总步数之间的整数。';}return false;}state.plans[id]={steps,current:n};save();closeModal();render();toast(`建议步骤已保存：当前第 ${n} / 共 ${steps.length} 步。`);return true;}
function resetSteps(id){delete state.plans[id];save();closeModal();render();toast('已恢复原始建议流程。');}
function legacyNotes(){const ids=[...new Set([...Object.keys(state.space.notes||{}),...Object.keys(state.space.scratch||{}),...Object.keys(state.space.draft||{})])];const sections=ids.map(id=>{const t=byId(id),note=state.space.notes?.[id],scratch=state.space.scratch?.[id]||[],draft=state.space.draft?.[id];return `<section class="detail-section"><h3>${esc(t?.title||'旧任务暂存')}</h3>${note?`<p><strong>续接笔记</strong><br>${esc(note.text)}</p>`:''}${draft?`<p style="margin-top:10px"><strong>未退出时的草稿</strong><br>${esc(draft)}</p>`:''}${scratch.length?`<ul>${scratch.map(x=>`<li>${esc(x.text)}</li>`).join('')}</ul>`:''}</section>`;}).join('');showModal(`${modalTop('只读保留 · 不需要在这里维护进度')}<h2 id="modalTitle">旧版暂存</h2><div class="modal-body"><p>此分享副本使用独立存储，不会读取私人版面板的任何笔记。初始没有暂存内容。</p>${sections||'<p class="small-note">本浏览器没有旧版暂存内容。</p>'}</div><div class="modal-actions"><button class="btn btn-secondary" data-close>关闭</button></div>`);}
function requestReset(){showModal(`${modalTop('仅重置本浏览器的 Demo 操作')}<h2 id="modalTitle">恢复演示的初始状态？</h2><div class="modal-body"><p>重置本地演示完成标记、筛选、优先级偏好和建议步骤。</p><p style="margin-top:10px">旧版暂存想法、续接笔记和未退出的草稿会保留。其他页面的浏览器数据不会读取或删除。</p></div><div class="modal-actions"><button class="btn btn-primary" id="confirmReset">重置操作，保留笔记</button><button class="btn btn-secondary" data-close>取消</button></div>`);}
function resetDemo(){const keep=clone(state.space);state=defaults();state.space.notes=keep.notes||{};state.space.scratch=keep.scratch||{};state.space.draft=keep.draft||{};save();closeModal();render();toast('已重置 Demo 操作；想法与续接笔记已保留。');}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.status)goStatus(d.status);else if('home'in d)navigate('home',{category:null});else if('categories'in d)navigate('categories',{category:null,project:'all',owner:'all'});else if(d.category)chooseCategory(d.category);else if(d.expand)toggleExpand(d.expand);else if(d.copyTask)copyTask(d.copyTask);else if(d.confirmRoute)confirmRoute(d.confirmRoute);else if(d.complete)completeTask(d.complete);else if(d.undo)undoTask(d.undo);else if(d.details)detailTask(d.details);else if(d.editSteps)editSteps(d.editSteps);else if(d.saveSteps)saveSteps(d.saveSteps,$('stepsInput').value,$('currentStepInput').value);else if(d.resetSteps)resetSteps(d.resetSteps);else if(d.restorePriority)restorePriority(d.restorePriority);else if('close'in d)closeModal();else if('reset'in d)requestReset();else if(b.id==='confirmReset')resetDemo();else if(b.id==='legacyNotes')legacyNotes();else if(b.id==='selectCopyText'){$('copyText')?.focus();$('copyText')?.select();}else if(b.id==='clearFilters')navigate('list',{status:'all',project:'all',owner:'all'});else if(b.id==='toastUndo'&&undoAction){const action=undoAction;undoAction=null;action();}});
document.addEventListener('change',e=>{if(e.target.dataset.priority)changePriority(e.target.dataset.priority,e.target.value);else if(['statusFilter','projectFilter','ownerFilter'].includes(e.target.id)){const key=e.target.id.replace('Filter','');state.nav[key]=e.target.value;save();render();}});
document.addEventListener('pointerover',e=>{if(e.pointerType==='touch')return;const card=e.target.closest('.task-card');if(card)revealCard(card,true);});
document.addEventListener('pointerout',e=>{if(e.pointerType==='touch')return;const card=e.target.closest('.task-card');if(card&&!card.contains(e.relatedTarget)&&!card.contains(document.activeElement))revealCard(card,false);});
document.addEventListener('focusin',e=>{const card=e.target.closest('.task-card');if(card)revealCard(card,true);});
document.addEventListener('focusout',e=>{const card=e.target.closest('.task-card');if(card&&!card.contains(e.relatedTarget))revealCard(card,false);});
$('modalBackdrop').addEventListener('click',e=>{if(e.target===$('modalBackdrop'))closeModal();});
document.addEventListener('keydown',e=>{if($('modalBackdrop').hidden)return;if(e.key==='Escape'){closeModal();e.preventDefault();return;}if(e.key==='Tab'){const nodes=[...$('modal').querySelectorAll('button:not([disabled]),a[href],select,input,textarea,[tabindex="0"]')],first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('modal'))){last?.focus();e.preventDefault();}else if(!e.shiftKey&&(document.activeElement===last||document.activeElement===$('modal'))){first?.focus();e.preventDefault();}}});
$('clockZone').textContent=Intl.DateTimeFormat().resolvedOptions().timeZone;
function tick(){$('clockText').textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false});}
if(state.current&&!seed.some(t=>t.id===state.current))state.current=null;
render();tick();setInterval(tick,1000);if(storageOK)save(false);
})();</script></body></html>
